<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  body { width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<!-- أيقونة ثلاثية الأبعاد: شخص ظهره للمشاهد (بلا ملامح) أمام جداول حسابات -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- خلفية مبهجة -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".45" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#065f46" stop-opacity=".35"/>
    </radialGradient>

    <!-- ورق الجداول -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2f4ec"/>
    </linearGradient>
    <linearGradient id="paperHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- جسد الشخص ثلاثي الأبعاد -->
    <linearGradient id="hair" x1=".3" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#4a3226"/>
      <stop offset="1" stop-color="#2b1c13"/>
    </linearGradient>
    <radialGradient id="headShade" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#6b4a35"/>
      <stop offset=".65" stop-color="#4a3226"/>
      <stop offset="1" stop-color="#2b1c13"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#c9e6d8"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset=".5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#064e3b" flood-opacity=".35"/>
    </filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064e3b" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- ===== الخلفية ===== -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

  <!-- ===== جداول الحسابات في الخلفية ===== -->
  <!-- الجدول الأول: مائل يساراً -->
  <g transform="translate(96,150) rotate(-9)" filter="url(#soft)">
    <rect width="470" height="360" rx="28" fill="url(#paper)"/>
    <rect width="470" height="64" rx="28" fill="url(#paperHead)"/>
    <rect y="36" width="470" height="28" fill="url(#paperHead)"/>
    <circle cx="40" cy="32" r="11" fill="#ffffff" opacity=".9"/>
    <circle cx="72" cy="32" r="11" fill="#ffffff" opacity=".6"/>
    <g stroke="#b8dcc9" stroke-width="3">
      <path d="M24 96h422M24 152h422M24 208h422M24 264h422M24 320h422"/>
      <path d="M24 96v244M176 96v244M320 96v244"/>
    </g>
    <g fill="#94a3b8" font-family="Arial" font-weight="bold">
      <rect x="40" y="116" width="70" height="14" rx="7"/>
      <rect x="192" y="116" width="96" height="14" rx="7" fill="#64748b"/>
      <rect x="336" y="116" width="80" height="14" rx="7" fill="#10b981"/>
      <rect x="40" y="172" width="82" height="14" rx="7"/>
      <rect x="192" y="172" width="60" height="14" rx="7" fill="#64748b"/>
      <rect x="336" y="172" width="92" height="14" rx="7" fill="#10b981"/>
      <rect x="40" y="228" width="58" height="14" rx="7"/>
      <rect x="192" y="228" width="100" height="14" rx="7" fill="#64748b"/>
      <rect x="336" y="228" width="70" height="14" rx="7" fill="#10b981"/>
    </g>
    <!-- عملة ذهبية صغيرة على الجدول -->
    <g transform="translate(392,318)" filter="url(#tiny)">
      <circle r="42" fill="url(#paperHead)"/>
      <circle r="42" fill="none" stroke="#d97706" stroke-width="4"/>
      <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#92400e">دج</text>
    </g>
  </g>

  <!-- الجدول الثاني: مائل يميناً وأخلف -->
  <g transform="translate(508,110) rotate(8) scale(.92)" filter="url(#soft)">
    <rect width="430" height="330" rx="26" fill="url(#paper)"/>
    <rect width="430" height="58" rx="26" fill="#10b981"/>
    <rect y="30" width="430" height="28" fill="#10b981"/>
    <circle cx="38" cy="29" r="10" fill="#ffffff" opacity=".85"/>
    <circle cx="66" cy="29" r="10" fill="#ffffff" opacity=".55"/>
    <g stroke="#b8dcc9" stroke-width="3">
      <path d="M22 86h386M22 138h386M22 190h386M22 242h386M22 294h386"/>
      <path d="M22 86v230M160 86v230M300 86v230"/>
    </g>
    <g fill="#94a3b8">
      <rect x="36" y="104" width="64" height="13" rx="6"/>
      <rect x="176" y="104" width="88" height="13" rx="6" fill="#64748b"/>
      <rect x="312" y="104" width="66" height="13" rx="6" fill="#10b981"/>
      <rect x="36" y="156" width="76" height="13" rx="6"/>
      <rect x="176" y="156" width="56" height="13" rx="6" fill="#64748b"/>
      <rect x="312" y="156" width="84" height="13" rx="6" fill="#10b981"/>
      <rect x="36" y="208" width="52" height="13" rx="6"/>
      <rect x="176" y="208" width="92" height="13" rx="6" fill="#64748b"/>
      <rect x="312" y="208" width="60" height="13" rx="6" fill="#10b981"/>
    </g>
    <!-- آلة حاسبة صغيرة -->
    <g transform="translate(318,300) rotate(14)" filter="url(#tiny)">
      <rect x="-52" y="-62" width="104" height="128" rx="16" fill="#f8fafc"/>
      <rect x="-52" y="-62" width="104" height="128" rx="16" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="-36" y="-46" width="72" height="26" rx="6" fill="#0f172a"/>
      <g fill="#10b981">
        <rect x="-36" y="-6" width="18" height="16" rx="4"/><rect x="-9" y="-6" width="18" height="16" rx="4"/><rect x="18" y="-6" width="18" height="16" rx="4"/>
        <rect x="-36" y="20" width="18" height="16" rx="4"/><rect x="-9" y="20" width="18" height="16" rx="4"/><rect x="18" y="20" width="18" height="16" rx="4"/>
        <rect x="-36" y="46" width="18" height="16" rx="4"/><rect x="-9" y="46" width="18" height="16" rx="4"/><rect x="18" y="46" width="18" height="16" rx="4" fill="#f59e0b"/>
      </g>
    </g>
  </g>

  <!-- قلم -->
  <g transform="translate(700,470) rotate(38)" filter="url(#tiny)">
    <rect x="-14" y="-120" width="28" height="200" rx="12" fill="#f59e0b"/>
    <rect x="-14" y="-120" width="28" height="70" rx="12" fill="#fbbf24"/>
    <path d="M-14 80 L0 112 L14 80 Z" fill="#1e293b"/>
  </g>

  <!-- ===== الشخص: ظهره للمشاهد، بلا ملامح ظاهرة ===== -->
  <g filter="url(#soft)">
    <!-- الكتفان والبدن -->
    <path d="M232 1024
             C232 820 320 726 512 726
             C704 726 792 820 792 1024 Z" fill="url(#vest)"/>
    <!-- القميص الأبيض: مثلث الظهر -->
    <path d="M432 748 L512 900 L592 748
             C566 734 540 728 512 728
             C484 728 458 734 432 748 Z" fill="url(#shirt)"/>
    <!-- ياقة -->
    <path d="M432 748 L472 788 L512 760 Z" fill="#ffffff"/>
    <path d="M592 748 L552 788 L512 760 Z" fill="#d7ebe0"/>
    <!-- الرقبة -->
    <path d="M462 660 h100 v96 c0 26 -22 44 -50 44 s-50 -18 -50 -44 Z" fill="#3d2a1e"/>
    <path d="M462 660 h100 v30 c-32 18 -68 18 -100 0 Z" fill="#2b1c13"/>
    <!-- الرأس من الخلف: قصّة شعر سوداء — لا ملامح -->
    <ellipse cx="512" cy="520" rx="176" ry="188" fill="url(#headShade)"/>
    <!-- الشعر: غطاء الظهر -->
    <path d="M336 512
             C336 384 408 330 512 330
             C616 330 688 384 688 512
             C688 584 672 640 656 668
             C640 616 636 560 628 520
             C610 556 580 574 512 574
             C444 574 414 556 396 520
             C388 560 384 616 368 668
             C352 640 336 584 336 512 Z" fill="url(#hair)"/>
    <!-- لمعة قصّة الشعر -->
    <path d="M420 396 C448 366 486 352 522 352" stroke="#6b4a35" stroke-width="14"
          stroke-linecap="round" fill="none" opacity=".55"/>
    <path d="M400 448 C412 424 432 406 452 394" stroke="#6b4a35" stroke-width="10"
          stroke-linecap="round" fill="none" opacity=".4"/>
    <!-- الأذنان -->
    <circle cx="336" cy="540" r="34" fill="#3d2a1e"/>
    <circle cx="688" cy="540" r="34" fill="#332217"/>
  </g>

  <!-- ===== إطار داخلي لامع ===== -->
  <rect x="26" y="26" width="972" height="972" rx="210" fill="none"
        stroke="#ffffff" stroke-opacity=".35" stroke-width="6"/>
  <path d="M80 950 A 880 880 0 0 1 130 118" stroke="#ffffff" stroke-opacity=".5"
        stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
</body>
</html>
