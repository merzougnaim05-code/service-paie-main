<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>تفعيل التطبيق — نظام تسيير الرواتب والتقاعد</title>
<style>
  :root {
    --emerald: #059669; --emerald-dark: #065f46; --emerald-light: #d1fae5;
    --amber: #f59e0b; --amber-light: #fef3c7;
    --slate: #0f172a; --slate-500: #64748b; --bg: #f8fafc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", sans-serif;
    background: linear-gradient(160deg, #ecfdf5 0%, #f8fafc 45%, #fffbeb 100%);
    color: var(--slate);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 560px;
    background: #ffffff; border-radius: 24px;
    border: 1px solid #a7f3d0;
    box-shadow: 0 24px 60px -20px rgba(6, 95, 70, .25);
    padding: 36px 32px 28px; text-align: center;
  }
  .logo {
    width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 22px;
    background: linear-gradient(145deg, #10b981, #047857 60%, #065f46);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 28px -10px rgba(5, 150, 105, .55), inset 0 2px 4px rgba(255,255,255,.35);
    position: relative; overflow: hidden;
  }
  .logo::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.4), transparent 45%);
  }
  .logo svg { width: 48px; height: 48px; z-index: 1; }
  h1 { font-size: 22px; margin-bottom: 6px; color: var(--emerald-dark); }
  .reason { color: #b45309; background: var(--amber-light); border: 1px solid #fde68a;
    border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.7; margin: 14px 0 20px;
    white-space: pre-line; text-align: right; }
  .label { font-size: 13px; color: var(--slate-500); text-align: right; margin-bottom: 6px; font-weight: 600; }
  .machine-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .machine-id {
    flex: 1; background: #f1f5f9; border: 1.5px dashed #94a3b8; border-radius: 12px;
    padding: 12px 14px; font-family: Consolas, monospace; font-size: 17px; letter-spacing: 1.5px;
    font-weight: 700; color: var(--slate); direction: ltr; user-select: all;
  }
  button {
    cursor: pointer; border: none; border-radius: 12px; font-family: inherit;
    font-size: 14px; font-weight: 700; transition: filter .15s, transform .05s;
  }
  button:active { transform: scale(.98); }
  .btn-copy { background: var(--emerald-light); color: var(--emerald-dark); padding: 0 16px; border: 1px solid #6ee7b7; }
  .btn-copy:hover { filter: brightness(.96); }
  .code-input {
    width: 100%; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 14px;
    font-family: Consolas, monospace; font-size: 16px; letter-spacing: 1px; text-align: center;
    direction: ltr; margin-bottom: 14px; outline: none; transition: border-color .15s;
  }
  .code-input:focus { border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
  .btn-activate {
    width: 100%; padding: 14px; font-size: 16px;
    background: linear-gradient(145deg, #10b981, #059669); color: #fff;
    box-shadow: 0 10px 22px -8px rgba(5, 150, 105, .5);
  }
  .btn-activate:hover { filter: brightness(1.06); }
  .btn-activate:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 22px; margin-top: 12px; font-size: 13.5px; font-weight: 600; }
  .msg.err { color: #dc2626; }
  .msg.ok { color: var(--emerald-dark); }
  .hint { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #e2e8f0;
    font-size: 12.5px; color: var(--slate-500); line-height: 1.9; }
  .hint a { color: var(--emerald-dark); font-weight: 700; text-decoration: none;
    background: var(--emerald-light); padding: 4px 12px; border-radius: 999px; border: 1px solid #6ee7b7; }
  .expiry-chip { display: inline-block; background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa;
    border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M3 9h18M8 4v16M15 4v16"/>
      </svg>
    </div>
    <h1 id="title">جاري تحميل حالة الترخيص…</h1>
    <span class="expiry-chip" id="expiryChip" style="display:none"></span>
    <div class="reason" id="reason">…</div>

    <div class="label">رقم هذا الجهاز (أرسله للمطوّر لتوليد كود التفعيل):</div>
    <div class="machine-row">
      <div class="machine-id" id="machineId">…</div>
      <button class="btn-copy" id="copyBtn">نسخ</button>
    </div>

    <div class="label">أدخل كود التفعيل:</div>
    <input class="code-input" id="codeInput" placeholder="SP1-20271231-XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocomplete="off">
    <button class="btn-activate" id="activateBtn">تفعيل التطبيق</button>
    <div class="msg" id="msg"></div>

    <div class="hint">
      التفعيل سنوي — عند انتهاء المدة يطلب التطبيق كوداً جديداً.
      <br>للحصول على كود التفعيل تواصل مع المطوّر:
      <a id="contactLink" href="#" target="_blank">مراسلة المطوّر</a>
    </div>
  </div>

<script>
  const CONTACT_URL = 'https://wa.me/213000000000'; /* رقم المطوّر للتواصل */
  document.getElementById('contactLink').href = CONTACT_URL;

  const machineEl = document.getElementById('machineId');
  const titleEl = document.getElementById('title');
  const reasonEl = document.getElementById('reason');
  const chipEl = document.getElementById('expiryChip');
  const msgEl = document.getElementById('msg');
  const codeEl = document.getElementById('codeInput');
  const btn = document.getElementById('activateBtn');

  function fmtExpiry(e) { return e ? `${e.slice(0,4)}/${e.slice(4,6)}/${e.slice(6,8)}` : ''; }

  window.addEventListener('DOMContentLoaded', () => {
    const st = window.licenseBridge.getState();
    machineEl.textContent = st.machineId || '—';
    titleEl.textContent = st.title || 'التطبيق مقفل';
    reasonEl.textContent = st.message || '';
    if (st.expiry) {
      chipEl.style.display = 'inline-block';
      chipEl.textContent = 'تاريخ الانتهاء: ' + fmtExpiry(st.expiry);
    }
    codeEl.focus();
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(machineEl.textContent.trim());
      msgEl.className = 'msg ok'; msgEl.textContent = 'تم نسخ رقم الجهاز — أرسله للمطوّر.';
    } catch {
      const r = document.createRange(); r.selectNode(machineEl);
      getSelection().removeAllRanges(); getSelection().addRange(r);
      document.execCommand('copy');
      msgEl.className = 'msg ok'; msgEl.textContent = 'تم نسخ رقم الجهاز — أرسله للمطوّر.';
    }
  });

  async function doActivate() {
    const code = codeEl.value.trim();
    if (!code) { msgEl.className = 'msg err'; msgEl.textContent = 'أدخل كود التفعيل أولاً.'; return; }
    btn.disabled = true; msgEl.className = 'msg'; msgEl.textContent = 'جاري التحقق…';
    const res = await window.licenseBridge.activate(code);
    if (res.ok) {
      msgEl.className = 'msg ok';
      msgEl.textContent = 'تم التفعيل بنجاح ✓ صالح حتى ' + fmtExpiry(res.expiry) + ' — جاري فتح التطبيق…';
      setTimeout(() => window.licenseBridge.done(), 1400);
    } else {
      msgEl.className = 'msg err';
      msgEl.textContent = res.error || 'الكود غير صالح.';
      btn.disabled = false;
    }
  }
  btn.addEventListener('click', doActivate);
  codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') doActivate(); });
</script>
</body>
</html>
